name: Daily Ingest - Registered Programs

# Scheduled runs use this workflow file from the default branch only (GitHub requirement).
on:
  schedule:
    # 09:30 Toronto during EDT (Mar–Nov): 13:30 UTC. Winter EST: use "30 14 * * *" instead.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      year_and_season:
        description: "Season identifier (e.g. 2026s4To)"
        required: false
        default: "2026s4To"
      season_names:
        description: "Comma-separated season names to scrape (matched against WHEN panel labels at runtime)"
        required: false
        default: "Fall 2026,CampTO 2026,Leadership 2026,ARC 2026/2027"
      export_only:
        description: "Skip scrape + insert; export from DB only"
        type: boolean
        default: false
      dry_run:
        description: "Run full pipeline but skip pushing JSON to frontend repo"
        type: boolean
        default: false

env:
  # Documented pattern for workflow_dispatch + schedule (inputs empty on schedule).
  YEAR_AND_SEASON: ${{ github.event.inputs.year_and_season || '2026s4To' }}
  SEASON_NAMES: ${{ github.event.inputs.season_names || 'Fall 2026,CampTO 2026,Leadership 2026,ARC 2026/2027' }}
  STARTDATE_CUTOFF: "2026-03-01"
  CITY: "To"
  CHROME_HEADLESS: "1"
  PYTHONUNBUFFERED: "1"
  TARGET_BRANCH: "main"

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.export_only != 'true' }}
    strategy:
      fail-fast: true  # cancel other groups immediately if any group fails
      matrix:
        include:
          - group: group-a
            activities: "Swim,Skate - ,Ski/Snowboard - "
          - group: group-b
            activities: "Sports -,Hobbies,Arts -,Leadership"
          - group: group-c
            activities: "CampTO,Early Years,FitnessTO,After School,Adapted Activities,Adapted Virtual"

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape (${{ matrix.group }})
        env:
          ACTIVITIES: ${{ matrix.activities }}
          GROUP: ${{ matrix.group }}
        run: python 1_scrape_w_selenium.py

      - name: Upload raw data (${{ matrix.group }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-data-${{ matrix.group }}
          path: raw_data/

  insert:
    runs-on: ubuntu-latest
    needs: scrape
    if: ${{ github.event.inputs.export_only != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all raw data
        uses: actions/download-artifact@v4
        with:
          pattern: raw-data-*
          path: raw_data/
          merge-multiple: true

      # Re-run clean per group to regenerate dfcrs.csv from merged raw data, then insert sequentially.
      - name: Clean + Insert group-a
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACTIVITIES: "Swim,Skate - ,Ski/Snowboard - "
        run: python 2_clean_data.py && python 3_insert_to_db.py

      - name: Clean + Insert group-b
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACTIVITIES: "Sports -,Hobbies,Arts -,Leadership"
        run: python 2_clean_data.py && python 3_insert_to_db.py

      - name: Clean + Insert group-c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACTIVITIES: "CampTO,Early Years,FitnessTO,After School,Adapted Activities,Adapted Virtual"
        run: python 2_clean_data.py && python 3_insert_to_db.py

      - name: Generate combined dfcrs.csv (all activities)
        run: python 2_clean_data.py
        # No ACTIVITIES set — defaults to all activities, writes combined dfcrs.csv

      - name: Geocoding audit (new centres only)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}
        run: python audit_geocoding.py --prefix ${{ env.YEAR_AND_SEASON }} --new-only --out audit_geocoding_results.csv

      - name: Upload geocoding audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocoding-audit-${{ github.run_id }}
          path: audit_geocoding_results.csv
          if-no-files-found: ignore

      - name: Check dfcrs → DB losslessness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import glob, json, os, sys
          import pandas as pd
          from sqlalchemy import create_engine, text

          YEAR_AND_SEASON   = os.environ["YEAR_AND_SEASON"]
          STARTDATE_CUTOFF  = os.environ.get("STARTDATE_CUTOFF", "2026-03-01")
          pk_prefix         = f"{YEAR_AND_SEASON}_%_"
          cutoff            = pd.Timestamp(STARTDATE_CUTOFF)

          # ── 1. Find the latest dfcrs.csv ──────────────────────────────────────
          csv_files = glob.glob("raw_data/**/dfcrs.csv", recursive=True)
          if not csv_files:
              print("No dfcrs.csv found under raw_data/ — skipping losslessness check")
              sys.exit(0)
          dfcrs_path = sorted(csv_files)[-1]
          print(f"Using dfcrs.csv: {dfcrs_path}")

          # ── 2. Build CSV barcode set (same scope as script 3) ─────────────────
          dfcrs = pd.read_csv(dfcrs_path)
          dfcrs["start_date"] = pd.to_datetime(dfcrs["start_date"])
          _truthy = {"1", "true", "t", "yes", "y"}
          if "has_enroll_now" in dfcrs.columns:
              has_enroll_now = dfcrs["has_enroll_now"].fillna(False).apply(
                  lambda v: str(v).strip().lower() in _truthy if not isinstance(v, bool) else v
              )
          else:
              has_enroll_now = pd.Series(False, index=dfcrs.index)
          mask = (dfcrs["start_date"] >= cutoff) | has_enroll_now
          dfcrs_sess = dfcrs[mask & dfcrs["Location"].notna()].copy()
          dfcrs_sess["Course Number"] = dfcrs_sess["Course Number"].astype(str)
          dfcrs_sess["barcode"] = (
              dfcrs_sess["program"]
              + pk_prefix
              + dfcrs_sess["Course Number"].str.replace("#", "", regex=False)
          )
          csv_barcodes = set(dfcrs_sess["barcode"].tolist())
          print(f"CSV barcodes in scope: {len(csv_barcodes)}")

          # ── 3. Query DB for barcodes ──────────────────────────────────────────
          def _like_escape(s):
              return s.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")

          escaped = _like_escape(pk_prefix)
          pattern = f"%{escaped}%"

          db_barcodes = set()
          db_error = None
          try:
              engine = create_engine(
                  os.environ["DATABASE_URL"],
                  connect_args={"connect_timeout": 30},
              )
              with engine.connect() as conn:
                  rows = conn.execute(
                      text(
                          "SELECT barcode FROM activities_sessions "
                          "WHERE barcode LIKE :p ESCAPE '\\' "
                          "AND (start_date >= :c OR has_enroll_now = TRUE)"
                      ),
                      {"p": pattern, "c": cutoff},
                  ).fetchall()
              db_barcodes = {r[0] for r in rows}
              print(f"DB barcodes in scope: {len(db_barcodes)}")
          except Exception as exc:
              db_error = str(exc)
              print(f"DB connection failed: {exc}")

          # ── 4. Compute diff ───────────────────────────────────────────────────
          only_csv = sorted(csv_barcodes - db_barcodes) if not db_error else []
          only_db  = sorted(db_barcodes  - csv_barcodes) if not db_error else []
          ok = len(only_csv) == 0 and not db_error

          result = {
              "csv":         len(csv_barcodes),
              "db":          len(db_barcodes),
              "csv_only":    len(only_csv),
              "db_only":     len(only_db),
              "ok":          ok,
              "sample_lost": only_csv[:15],
              "error":       db_error,
          }

          # ── 5. Write losslessness_insert.json (always, even on DB error) ───────
          season_dir = os.path.dirname(dfcrs_path)
          out_path = os.path.join(season_dir, "losslessness_insert.json")
          with open(out_path, "w") as f:
              json.dump(result, f, indent=2)
          print(f"Written: {out_path}")

          if db_error:
              print("Skipping losslessness diff — DB unavailable")
              sys.exit(0)

          # ── 7. Exit non-zero if any CSV barcodes are missing from DB ──────────
          if only_csv:
              print(f"\nLOSSLESSNESS FAILED: {len(only_csv)} barcodes in dfcrs not found in DB")
              for b in only_csv[:15]:
                  print(f"  missing: {b}")
              sys.exit(1)

          print("dfcrs → DB losslessness: OK")
          EOF

      - name: Upload combined dfcrs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfcrs-combined
          path: raw_data/

  export:
    runs-on: ubuntu-latest
    needs: [scrape, insert]
    if: always()

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4.2.2

      - name: Checkout target (${{ env.TARGET_BRANCH }})
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download combined dfcrs
        if: ${{ github.event.inputs.export_only != 'true' && (needs.insert.result == 'success' || needs.insert.result == 'skipped') }}
        continue-on-error: true   # artifact absent when insert was skipped due to upstream failure
        uses: actions/download-artifact@v4
        with:
          name: dfcrs-combined
          path: raw_data/

      # Fallback when the scrape job itself failed (e.g. scrape_errors -- an
      # activity produced no data): insert never runs in that case (its `needs:
      # scrape` is unmet), so "dfcrs-combined" above is never uploaded and
      # raw_data/ stays empty -- meaning scrape_error.json / skipped_seasons
      # never reach the "Validate output files" step below and the failure
      # goes undetailed in the summary even though the job correctly shows
      # red. Pull the per-group artifacts scrape uploads directly (with
      # `if: always()`, so they exist even when that group's step failed).
      - name: Download raw scrape data (fallback when insert did not run)
        if: ${{ github.event.inputs.export_only != 'true' && needs.insert.result != 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: raw-data-*
          path: raw_data/
          merge-multiple: true

      - name: Export JSON to target
        if: needs.insert.result == 'success' || needs.insert.result == 'skipped'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT_DIR: ${{ github.workspace }}/target/public/data
          SCRAPE_RUN: scraped${{ github.run_id }}
          EXPORT_LATEST_SCRAPE_ONLY: "1"
        run: python 4_db_to_json.py

      - name: Sanity-check session counts vs previous export
        run: |
          python - <<'EOF'
          import json, os, sys, glob

          season   = os.environ["YEAR_AND_SEASON"]
          data_dir = "target/public/data"
          counts_path = os.path.join(data_dir, "export_counts.json")
          DROP_THRESHOLD = 0.20   # fail if any program loses > 20% of sessions
          ZERO_SESSION_MIN = 5    # programs with >= this many sessions before cannot drop to 0

          try:
              prev = {r["program"]: r["sessions"] for r in json.load(open(counts_path))["counts"]}
          except Exception:
              print("No previous export_counts.json found — skipping regression check")
              sys.exit(0)

          sport_files = glob.glob(os.path.join(data_dir, f"*_{season}.json"))
          if not sport_files:
              print("No new sport files yet — skipping regression check")
              sys.exit(0)

          errors = []
          for path in sport_files:
              program = os.path.basename(path).replace(f"_{season}.json", "")
              if program not in prev:
                  continue
              try:
                  new_count = len(json.load(open(path))["sessionsWithCourses"])
              except Exception:
                  continue
              old_count = prev[program]
              if old_count >= ZERO_SESSION_MIN and new_count == 0:
                  errors.append(f"{program}: {old_count} → 0 sessions (complete wipeout)")
              elif old_count > 0:
                  drop = (old_count - new_count) / old_count
                  if drop > DROP_THRESHOLD:
                      errors.append(f"{program}: {old_count} → {new_count} sessions ({drop:.0%} drop)")

          if errors:
              print("REGRESSION CHECK FAILED — session count dropped too much:")
              for e in errors:
                  print(f"  ✗ {e}")
              print("Aborting push to main. Investigate before re-running.")
              sys.exit(1)

          print("Regression check passed.")
          EOF

      - name: Validate output files
        env:
          SCRAPE_RESULT: ${{ needs.scrape.result }}
          INSERT_RESULT: ${{ needs.insert.result }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import glob, json, os, sys
          from collections import defaultdict
          from datetime import datetime, timezone

          season        = os.environ["YEAR_AND_SEASON"]
          data_dir      = "target/public/data"
          summary_path  = os.environ.get("GITHUB_STEP_SUMMARY", "")
          run_id        = os.environ.get("GITHUB_RUN_ID", "local")
          repo          = os.environ.get("GITHUB_REPOSITORY", "")
          run_url       = f"https://github.com/{repo}/actions/runs/{run_id}" if repo else ""
          now_str       = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          _emoji = {"success": "✅", "failure": "❌", "skipped": "⏭️", "cancelled": "🚫"}
          scrape_result = os.environ.get("SCRAPE_RESULT", "skipped")
          insert_result = os.environ.get("INSERT_RESULT", "skipped")
          scrape_display = f"{_emoji.get(scrape_result, '')} {scrape_result}"
          insert_display = f"{_emoji.get(insert_result, '')} {insert_result}"

          # ── 0. Load losslessness_insert.json from insert job artifact ─────────
          import glob as _glob
          _li_files = _glob.glob("raw_data/**/losslessness_insert.json", recursive=True)
          _li = json.load(open(_li_files[0])) if _li_files else None
          if _li:
              print(f"Loaded losslessness_insert.json: csv={_li['csv']} db={_li['db']} csv_only={_li['csv_only']}")
          else:
              print("losslessness_insert.json not found — DB→JSON losslessness check will be partial")

          # ── 0b. Load skipped_seasons_*.json (one per scrape matrix group) ──────
          # Previously only printed to a scrape job's own stderr, never surfaced
          # here -- a season's activities panel timing out (scraped OK for every
          # OTHER season that day, just silently missing this one) produced no
          # visible signal anywhere a human would actually look. Real occurrence:
          # 2026-08-10, group-a, season 24 (CampTO 2026) timed out and was
          # skipped -- found only by manually reading raw scrape logs.
          skipped_seasons = []
          for _sf in _glob.glob("raw_data/**/skipped_seasons_*.json", recursive=True):
              try:
                  _group = os.path.basename(_sf).removeprefix("skipped_seasons_").removesuffix(".json")
                  for _entry in json.load(open(_sf)):
                      skipped_seasons.append({"group": _group, **_entry})
              except Exception as _exc:
                  print(f"Could not read {_sf}: {_exc}")
          if skipped_seasons:
              print(f"Skipped seasons across all scrape groups: {len(skipped_seasons)}")

          # ── 0c. Load clean_data_issues.json (missing source files + unparseable
          # dates from 2_clean_data.py). Previously these only printed to that
          # step's own stdout -- a row with an unparseable Date silently drops out
          # of session_insert_mask in 3_insert_to_db.py (NaT >= cutoff is False)
          # unless has_enroll_now happens to be set, with no trace anywhere else.
          clean_data_missing_files = []
          clean_data_unparsed_dates = []
          _cdi_files = _glob.glob("raw_data/**/clean_data_issues.json", recursive=True)
          if _cdi_files:
              try:
                  _cdi = json.load(open(_cdi_files[0]))
                  clean_data_missing_files = _cdi.get("missing_files", [])
                  clean_data_unparsed_dates = _cdi.get("unparsed_dates", [])
                  print(f"Loaded clean_data_issues.json: {len(clean_data_missing_files)} missing files, {len(clean_data_unparsed_dates)} unparsed dates")
              except Exception as _exc:
                  print(f"Could not read {_cdi_files[0]}: {_exc}")

          # ── 0d. Load audit_geocoding_flags.json (reverse-geocode mismatches for
          # new centres). Previously only uploaded as a standalone CSV artifact --
          # nothing surfaced flagged centres in the step summary itself.
          geocoding_flags = []
          geocoding_audited = 0
          _gf_files = _glob.glob("raw_data/**/audit_geocoding_flags.json", recursive=True)
          if _gf_files:
              try:
                  _gf = json.load(open(_gf_files[0]))
                  geocoding_audited = _gf.get("audited", 0)
                  geocoding_flags = _gf.get("flagged", [])
                  print(f"Loaded audit_geocoding_flags.json: {geocoding_audited} audited, {len(geocoding_flags)} flagged")
              except Exception as _exc:
                  print(f"Could not read {_gf_files[0]}: {_exc}")

          # ── 0e. Load scrape_error.json (per-activity exceptions during scraping,
          # e.g. a stale/vanished "View more" button). Written unconditionally by
          # 1_scrape_w_selenium.py's per-activity except block once retries are
          # exhausted, but previously only ever landed on disk -- never read by
          # anything -- so an activity going fully missing for a season (real
          # occurrence: 2026-08-20, CampTO Extended Hours, season 24) produced no
          # signal anywhere. The run still exits 0 (this is caught, not raised),
          # so there's no failure email either -- this summary section is the
          # only place a human will see it without digging through raw logs.
          scrape_errors = []
          for _se in _glob.glob("raw_data/**/scrape_error.json", recursive=True):
              try:
                  scrape_errors.append(json.load(open(_se)))
              except Exception as _exc:
                  print(f"Could not read {_se}: {_exc}")
          if scrape_errors:
              print(f"Scrape errors: {len(scrape_errors)}")

          # ── 1. Load insert summary (found vs saved per series) ────────────────
          insert_summary = []
          geocode_failures = []
          no_location_in_scrape = []
          for p in glob.glob("raw_data/**/insert_summary.json", recursive=True):
              try:
                  raw = json.load(open(p))
                  if isinstance(raw, dict):
                      insert_summary       = raw.get("series", [])
                      geocode_failures     = raw.get("geocode_failures", [])
                      no_location_in_scrape = raw.get("no_location_in_scrape", [])
                  else:
                      insert_summary = raw  # backward compat: old list format
                  print(f"Loaded insert summary: {p} ({len(insert_summary)} series, {len(geocode_failures)} geocode failures, {len(no_location_in_scrape)} no-location-in-scrape)")
                  break
              except Exception:
                  pass

          # ── 2. Validate exported JSON files ───────────────────────────────────
          sport_files = sorted(glob.glob(os.path.join(data_dir, f"*_{season}.json")))
          errors = []
          desc_warnings = []
          if not sport_files:
              errors.append(f"No sport JSON files found matching *_{season}.json under {data_dir}")

          export_rows = []                     # (sport, count, no_loc_count)
          no_loc_by_centre = defaultdict(list) # (sport, centre) -> [session_nums]
          total_sessions = 0
          non_empty = 0

          # Description coverage tracking
          desc_missing_by_program = {}         # program -> (missing_count, total_count)
          total_desc_missing = 0

          all_sessions_list = []               # collect all sessions for desc coverage

          for path in sport_files:
              sport = os.path.basename(path).replace(f"_{season}.json", "")
              try:
                  data = json.load(open(path))
                  if not isinstance(data, dict) or "sessionsWithCourses" not in data:
                      errors.append(f"{os.path.relpath(path)}: unexpected format")
                      continue
                  sessions = data["sessionsWithCourses"]
                  count = len(sessions)
                  total_sessions += count
                  if count > 0:
                      non_empty += 1
                  no_loc = [s for s in sessions if s.get("latitude") is None or s.get("longitude") is None]
                  for s in no_loc:
                      barcode  = s.get("barcode", "")
                      sess_num = barcode.split("_%_")[-1] if "_%_" in barcode else barcode
                      centre   = s.get("centre") or "(no centre)"
                      no_loc_by_centre[(sport, centre)].append(sess_num)
                  export_rows.append((sport, count, len(no_loc)))
                  print(f"{os.path.relpath(path)}: {count} sessions, {len(no_loc)} no-location")
                  # Description coverage per program
                  missing_desc = sum(
                      1 for s in sessions
                      if str(s.get("desc") or "").strip() in ("", "None", "null", "nan")
                  )
                  desc_missing_by_program[sport] = (missing_desc, count)
                  total_desc_missing += missing_desc
              except json.JSONDecodeError as e:
                  errors.append(f"{os.path.relpath(path)}: invalid JSON — {e}")

          if sport_files and non_empty == 0:
              errors.append("All sport files are empty — scrape likely failed")

          total_no_loc = sum(r[2] for r in export_rows)

          # ── 2b. DB → JSON losslessness check ──────────────────────────────────
          db_json_ok = None
          db_json_lost = None
          db_scoped_count = None
          expected_json = None

          STARTDATE_CUTOFF = os.environ.get("STARTDATE_CUTOFF", "2026-03-01")
          pk_prefix = f"{season}_%_"

          def _like_escape(s):
              return s.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")

          db_url = os.environ.get("DATABASE_URL", "")
          if db_url:
              try:
                  import pandas as pd
                  from sqlalchemy import create_engine, text
                  cutoff = pd.Timestamp(STARTDATE_CUTOFF)
                  escaped = _like_escape(pk_prefix)
                  pattern = f"%{escaped}%"
                  engine = create_engine(db_url, connect_args={"connect_timeout": 30})
                  with engine.connect() as conn:
                      row = conn.execute(
                          text(
                              "SELECT COUNT(*) as n FROM activities_sessions "
                              "WHERE barcode LIKE :p ESCAPE '\\' "
                              "AND (start_date >= :cutoff OR has_enroll_now = TRUE)"
                          ),
                          {"p": pattern, "cutoff": cutoff},
                      ).fetchone()
                  db_scoped_count = row[0] if row else 0
                  print(f"DB scoped session count: {db_scoped_count}")
                  if _li is not None:
                      expected_json = _li["csv"]
                      db_json_lost = expected_json - total_sessions
                      db_json_ok = (db_json_lost == 0)
                      if not db_json_ok:
                          errors.append(
                              f"DB→JSON losslessness: expected {expected_json} sessions in JSON "
                              f"(from dfcrs scope) but found {total_sessions} — lost={db_json_lost}"
                          )
                  else:
                      # Fallback: compare DB count vs JSON count directly
                      db_json_lost = db_scoped_count - total_sessions
                      db_json_ok = (db_json_lost == 0)
                      expected_json = db_scoped_count
                      if not db_json_ok:
                          errors.append(
                              f"DB→JSON losslessness: DB has {db_scoped_count} scoped sessions "
                              f"but JSON has {total_sessions} — lost={db_json_lost}"
                          )
              except Exception as exc:
                  print(f"DB→JSON losslessness check failed (DB error): {exc}")
          else:
              print("DATABASE_URL not set — skipping DB→JSON losslessness check")

          # Description coverage: hard fail if > 5% missing, soft warning otherwise
          DESC_MISSING_THRESHOLD = 0.05
          if total_sessions > 0 and total_desc_missing > 0:
              pct = total_desc_missing / total_sessions * 100
              if total_desc_missing / total_sessions > DESC_MISSING_THRESHOLD:
                  errors.append(
                      f"Description coverage: {total_desc_missing}/{total_sessions} sessions missing desc ({pct:.1f}%) — exceeds {DESC_MISSING_THRESHOLD:.0%} threshold"
                  )
              else:
                  desc_warnings.append(
                      f"Description coverage: {total_desc_missing}/{total_sessions} sessions missing desc ({pct:.1f}%)"
                  )

          # ── 3. Write $GITHUB_STEP_SUMMARY ─────────────────────────────────────
          if summary_path:
              overall  = "✅ Passed" if not errors else "❌ Failed"
              run_link = f"[{run_id}]({run_url})" if run_url else run_id
              _fmt     = lambda n: f"{n:,}" if isinstance(n, int) else "N/A"
              desc_pct = f"{total_desc_missing / total_sessions * 100:.1f}%" if total_sessions > 0 else "N/A"
              desc_flag = "✅" if total_desc_missing == 0 else ("❌" if total_sessions > 0 and total_desc_missing / total_sessions > DESC_MISSING_THRESHOLD else "⚠️")

              L = [
                  f"# Daily Ingest — {overall}",
                  f"**Season:** `{season}` | **Run:** {run_link} | **Time:** {now_str}",
                  "",
              ]

              # Errors first — most important when the run is failing
              if errors:
                  L += ["## ❌ Errors", ""]
                  for e in errors:
                      L.append(f"- {e}")
                  L.append("")

              # Job status
              L += [
                  "## Status",
                  "",
                  "| Job | Result |",
                  "|-----|--------|",
                  f"| Scrape | {scrape_display} |",
                  f"| Insert | {insert_display} |",
                  f"| Export | {'✅ success' if not errors else '❌ failed'} |",
                  "",
              ]

              # Pipeline health — compact table
              pipeline_rows = []
              if _li is not None:
                  li_flag = "✅" if _li.get("ok") else "❌"
                  pipeline_rows.append(
                      f"| dfcrs → DB | {_fmt(_li['csv'])} → {_fmt(_li['db'])} | {_li['csv_only']} | {li_flag} |"
                  )
              if db_json_ok is not None:
                  dj_flag = "✅" if db_json_ok else "❌"
                  pipeline_rows.append(
                      f"| DB → JSON | {_fmt(db_scoped_count)} → {_fmt(total_sessions)} | {_fmt(db_json_lost)} | {dj_flag} |"
                  )
              coord_flag = "✅" if total_no_loc == 0 else "⚠️"
              pipeline_rows.append(
                  f"| Coordinates | {total_no_loc} missing | — | {coord_flag} |"
              )
              pipeline_rows.append(
                  f"| Descriptions | {total_desc_missing} missing ({desc_pct}) | — | {desc_flag} |"
              )
              skip_flag = "✅" if not skipped_seasons else "⚠️"
              pipeline_rows.append(
                  f"| Skipped seasons | {len(skipped_seasons)} panel timeout(s) | — | {skip_flag} |"
              )
              scrape_err_flag = "✅" if not scrape_errors else "⚠️"
              pipeline_rows.append(
                  f"| Scrape errors | {len(scrape_errors)} activity failure(s) | — | {scrape_err_flag} |"
              )
              _clean_issue_flag = "✅" if not (clean_data_missing_files or clean_data_unparsed_dates) else "⚠️"
              pipeline_rows.append(
                  f"| Clean-data issues | {len(clean_data_missing_files)} missing file(s), {len(clean_data_unparsed_dates)} unparsed date(s) | — | {_clean_issue_flag} |"
              )
              _geo_flag = "✅" if not geocoding_flags else "⚠️"
              pipeline_rows.append(
                  f"| Geocoding audit | {len(geocoding_flags)}/{geocoding_audited} flagged | — | {_geo_flag} |"
              )
              L += [
                  "## Pipeline",
                  "",
                  "| Stage | Count | Lost | Status |",
                  "|-------|-------|-----:|:------:|",
              ] + pipeline_rows + [""]

              # One-line output summary
              L += [
                  f"**{_fmt(total_sessions)} sessions** exported across {non_empty} programs",
                  "",
              ]

              # Per-program breakdown (collapsed)
              if export_rows:
                  L += [
                      f"<details><summary>Per-program ({len(export_rows)} programs)</summary>",
                      "",
                      "| Program | Sessions | No Location |",
                      "|---------|:--------:|:-----------:|",
                  ]
                  for sport, count, no_loc in export_rows:
                      flag = " ⚠️" if no_loc > 0 else ""
                      L.append(f"| {sport} | {count} | {no_loc}{flag} |")
                  L += [f"| **Total** | **{_fmt(total_sessions)}** | **{total_no_loc}** |", "", "</details>", ""]

              # Insert detail (collapsed)
              if insert_summary:
                  total_found   = sum(r["found"]          for r in insert_summary)
                  total_saved   = sum(r["saved"]          for r in insert_summary)
                  total_dropped = sum(r.get("dropped", 0) for r in insert_summary)
                  drop_flag = " ⚠️" if total_dropped > 0 else ""
                  L += [
                      f"<details><summary>Insert detail — {_fmt(total_found)} found → {_fmt(total_saved)} saved{drop_flag}</summary>",
                      "",
                      "| Program | Series | Found | Saved | Dropped |",
                      "|---------|--------|------:|------:|--------:|",
                  ]
                  for r in insert_summary:
                      dropped = r.get("dropped", 0)
                      warn = " ⚠️" if dropped > 0 else ""
                      L.append(f"| {r['program']} | {r['series']} | {r['found']} | {r['saved']} | {dropped}{warn} |")
                  L += ["</details>", ""]
              else:
                  L += ["<details><summary>Insert detail</summary>", "", "_Not available (export-only or insert skipped)_", "", "</details>", ""]

              # Sessions without location in scrape (collapsed)
              if no_location_in_scrape:
                  _by_prog = defaultdict(list)
                  for r in no_location_in_scrape:
                      _by_prog[(r["program"], r["series"])].append(r["session_number"])
                  L += [
                      f"<details><summary>⚠️ {len(no_location_in_scrape)} sessions dropped — no location in scrape</summary>",
                      "",
                      "| Program | Series | # | Session Numbers |",
                      "|---------|--------|--:|-----------------|",
                  ]
                  for (prog, series), nums in sorted(_by_prog.items()):
                      nums_str = ", ".join(f"`{n}`" for n in nums[:15])
                      if len(nums) > 15:
                          nums_str += f" … +{len(nums) - 15} more"
                      L.append(f"| {prog} | {series} | {len(nums)} | {nums_str} |")
                  L += ["</details>", ""]

              # Sessions without coordinates in export (collapsed)
              if no_loc_by_centre:
                  L += [
                      f"<details><summary>⚠️ {total_no_loc} sessions without coordinates in export</summary>",
                      "",
                      "| Program | Centre | # | Session Numbers |",
                      "|---------|--------|--:|-----------------|",
                  ]
                  for (sport, centre), sess_nums in sorted(no_loc_by_centre.items()):
                      nums_str = ", ".join(f"`{n}`" for n in sess_nums[:15])
                      if len(sess_nums) > 15:
                          nums_str += f" … +{len(sess_nums) - 15} more"
                      L.append(f"| {sport} | {centre} | {len(sess_nums)} | {nums_str} |")
                  L += ["</details>", ""]

              # Skipped seasons (collapsed) -- a scrape-time panel timeout, not a
              # data-quality issue in what WAS scraped; surfaced separately from
              # geocoding/description gaps since it means something wasn't even
              # attempted, not that it was attempted and came back thin.
              if skipped_seasons:
                  L += [
                      f"<details><summary>⚠️ {len(skipped_seasons)} season(s) skipped during scrape (panel timeout)</summary>",
                      "",
                      "_These activity/season combinations were not scraped at all today -- retried automatically tomorrow._",
                      "",
                      "| Group | Season ID | Error |",
                      "|-------|-----------|-------|",
                  ]
                  for s in skipped_seasons:
                      L.append(f"| {s['group']} | {s['season_id']} | {s['error'][:120]} |")
                  L += ["</details>", ""]

              # Scrape errors (collapsed) -- an activity that WAS attempted but raised
              # an exception (e.g. a stale/vanished pagination button) after exhausting
              # retries. Unlike skipped seasons, this activity has NO courses.csv at
              # all for today -- distinct from the coordinates/description gaps above,
              # which are about scraped data that came back thin, not missing entirely.
              if scrape_errors:
                  L += [
                      f"<details><summary>⚠️ {len(scrape_errors)} activity scrape error(s)</summary>",
                      "",
                      "_These activities produced no data today at all -- retried automatically tomorrow._",
                      "",
                      "| Activity | Season ID | Error |",
                      "|----------|-----------|-------|",
                  ]
                  for e in scrape_errors:
                      err = f"[{e.get('error_type','')}] {e.get('error_message','')}"[:120]
                      L.append(f"| {e.get('activity_name','')} | {e.get('season_id','')} | {err} |")
                  L += ["</details>", ""]

              # Geocoding failures (collapsed)
              if geocode_failures:
                  L += [
                      f"<details><summary>⚠️ {len(geocode_failures)} geocoding failures</summary>",
                      "",
                      "_Sessions are in the DB but export without coordinates._",
                      "",
                  ]
                  for c in geocode_failures:
                      L.append(f"- `{c}`")
                  L += ["</details>", ""]

              # Clean-data issues (collapsed): missing/empty source files and rows
              # whose Date text didn't parse (silently excluded from insert unless
              # has_enroll_now is set -- see 3_insert_to_db.py session_insert_mask).
              if clean_data_missing_files:
                  L += [
                      f"<details><summary>⚠️ {len(clean_data_missing_files)} missing/empty source file(s) in clean step</summary>",
                      "",
                      "| Activity | Series | File | Reason |",
                      "|----------|--------|------|--------|",
                  ]
                  for m in clean_data_missing_files:
                      L.append(f"| {m['activity']} | {m['series']} | {m['file']} | {m['reason']} |")
                  L += ["</details>", ""]

              if clean_data_unparsed_dates:
                  L += [
                      f"<details><summary>⚠️ {len(clean_data_unparsed_dates)} row(s) with unparseable Date</summary>",
                      "",
                      "_Dropped from insert scope unless has_enroll_now is set -- not tracked anywhere else._",
                      "",
                      "| Program | Series | Course # | Raw Date |",
                      "|---------|--------|----------|----------|",
                  ]
                  for d in clean_data_unparsed_dates[:30]:
                      L.append(f"| {d.get('program','')} | {d.get('series','')} | {d.get('course_number','')} | {str(d.get('Date',''))[:60]} |")
                  if len(clean_data_unparsed_dates) > 30:
                      L.append(f"| … | | | +{len(clean_data_unparsed_dates) - 30} more |")
                  L += ["</details>", ""]

              # Geocoding audit flags (collapsed): reverse-geocode mismatches for
              # newly-inserted centres, or a failed reverse-geocode call.
              if geocoding_flags:
                  L += [
                      f"<details><summary>⚠️ {len(geocoding_flags)}/{geocoding_audited} centres flagged by geocoding audit</summary>",
                      "",
                      "| Name | Stored Address | Reverse Address | Distance (m) | Reason |",
                      "|------|-----------------|------------------|--------------:|--------|",
                  ]
                  for g in geocoding_flags:
                      L.append(
                          f"| {g.get('name','')} | {g.get('stored_address','')} | {g.get('reverse_address','')} | "
                          f"{g.get('distance_m','')} | {g.get('flag_reason','')} |"
                      )
                  L += ["</details>", ""]

              # Description gaps (collapsed)
              if total_desc_missing > 0:
                  L += [
                      f"<details><summary>⚠️ Description gaps — {total_desc_missing} sessions ({desc_pct} missing)</summary>",
                      "",
                      "| Program | Missing | Total | % |",
                      "|---------|--------:|------:|--:|",
                  ]
                  for prog, (missing, total_p) in sorted(desc_missing_by_program.items()):
                      if missing > 0:
                          pct_p = f"{missing / total_p * 100:.1f}%" if total_p > 0 else "N/A"
                          L.append(f"| {prog} | {missing} | {total_p} | {pct_p} |")
                  L += ["</details>", ""]

              with open(summary_path, "w") as f:
                  f.write("\n".join(L))

          # ── 4. Exit ────────────────────────────────────────────────────────────
          if errors:
              print("\nVALIDATION FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          if desc_warnings:
              for w in desc_warnings:
                  print(f"  WARNING: {w}")

          print(f"\n{non_empty}/{len(sport_files)} files have data, {total_no_loc} sessions missing location")
          EOF

      - name: Pipeline health check (script 5)
        if: needs.insert.result == 'success' || needs.insert.result == 'skipped'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT_DIR: ${{ github.workspace }}/target/public/data
        run: python 5_check_data.py --deep --no-write-csv

      - name: Upload exported JSON as artifact
        if: needs.insert.result == 'success' || needs.insert.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: exported-json-${{ github.run_id }}
          path: target/public/data/

      - name: Commit and push to target
        if: (needs.insert.result == 'success' || needs.insert.result == 'skipped') && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped') && github.event.inputs.dry_run != 'true'
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to public data — skipping commit"
          else
            git commit -m "chore: update programs data $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ env.TARGET_BRANCH }}
            git push
          fi
