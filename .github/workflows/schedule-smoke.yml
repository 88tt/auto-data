# Delete this file after you confirm scheduled workflows appear under Actions.
# If this runs but daily-ingest does not, debug the main workflow; if this never runs, check repo Actions settings / default branch.
name: Schedule smoke test

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: echo "schedule ok $(date -u +%Y-%m-%dT%H:%MZ)"
